<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Safe Space｜笑話題庫審核</title><style>body{margin:0;background:#f7f4ef;color:#4f4a47;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif}main{max-width:1080px;margin:auto;padding:18px}.bar{position:sticky;top:0;z-index:10;background:rgba(247,244,239,.96);backdrop-filter:blur(10px);padding:8px 0 14px}.tools{display:grid;grid-template-columns:2fr 1fr 1fr;gap:8px}input,select{font:inherit;padding:10px 12px;border:1px solid #ddd;border-radius:12px;background:#fff}.item{background:#fff;border-radius:18px;margin:12px 0;padding:16px;box-shadow:0 6px 20px rgba(0,0,0,.06)}.item.legacy{opacity:.72}.no{font-size:.92rem;font-weight:900;color:#6c9662}.meta{font-size:.8rem;color:#8c847e;margin:5px 0 12px}.badge{display:inline-block;background:#eef4eb;border-radius:999px;padding:3px 8px;margin-right:4px}.joke{white-space:pre-wrap;line-height:1.75}.label{font-weight:800;margin-top:10px}.answer{margin-top:10px;padding:10px 12px;background:#f2eee8;border-radius:12px}.small{font-size:.75rem;color:#938b84;margin-top:10px}@media(max-width:700px){main{padding:12px}.tools{grid-template-columns:1fr}}</style></head><body><main><div class="bar"><h1>Safe Space｜笑話題庫審核</h1><p style="line-height:1.6;color:#7c746e">Q = 新版候選題庫，目前遊戲會優先使用；L = 原 v6.2 題庫，目前停用，只供你挑選／要求我改寫。之後你可以直接告訴我：「Q003 可以、Q014 不好笑、L107 重寫」即可。</p><div class="tools"><input id="search" placeholder="搜尋編號、笑友、內容…"><select id="status"><option value="all">全部</option><option value="active">目前使用</option><option value="legacy">原題庫</option></select><select id="kind"><option value="all">全部類型</option><option value="one_liner">短笑話</option><option value="dialogue">對話</option><option value="riddle">急轉彎</option><option value="story">長篇</option></select></div></div><div id="list"></div></main><script src="./js/features/jokes-data.js"></script><script>const db=window.SAFE_SPACE_JOKES_DB;const names=new Map(db.friends.map(f=>[f.id,f.name]));const list=document.getElementById('list');const esc=s=>String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');const kl=k=>({one_liner:'短笑話',dialogue:'對話',riddle:'急轉彎',story:'長篇'})[k]||k;function render(){const q=document.getElementById('search').value.trim().toLowerCase(),st=document.getElementById('status').value,k=document.getElementById('kind').value;const arr=db.jokes.filter(j=>{const legacy=j.enabled===false;if(st==='active'&&legacy)return false;if(st==='legacy'&&!legacy)return false;if(k!=='all'&&j.kind!==k)return false;const who=(j.friendIds||[]).map(id=>names.get(id)||id).join(' ');const hay=[j.reviewNo,j.id,j.category,j.text,j.question,j.answer,j.reveal,j.explain,who].join(' ').toLowerCase();return !q||hay.includes(q)});list.innerHTML=arr.map(j=>{const legacy=j.enabled===false;const who=(j.friendIds||[]).map(id=>names.get(id)||id).join('、');return `<article class="item ${legacy?'legacy':''}"><div class="no">${esc(j.reviewNo)} · ${legacy?'原題庫 / 待審核':'目前使用'}</div><div class="meta"><span class="badge">${esc(kl(j.kind))}</span>${esc(j.category)}${who?' · 笑友：'+esc(who):''}</div>${j.title?`<div class="label">${esc(j.title)}</div>`:''}${j.text?`<div class="joke">${esc(j.text)}</div>`:''}${j.question?`<div class="label">題目</div><div class="joke">${esc(j.question)}</div>`:''}${(j.answer||j.reveal||j.explain)?`<details class="answer"><summary>查看答案／笑點</summary>${j.answer?`<div class="label">答案：${esc(j.answer)}</div>`:''}${j.reveal?`<div class="label">收尾：${esc(j.reveal)}</div>`:''}${j.explain?`<div class="label">梗點：${esc(j.explain)}</div>`:''}</details>`:''}<div class="small">ID：${esc(j.id)}</div></article>`}).join('')}['search','status','kind'].forEach(id=>document.getElementById(id).addEventListener('input',render));render();</script></body></html>

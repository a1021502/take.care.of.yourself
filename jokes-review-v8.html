<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Safe Space｜笑話題庫 v8 審核</title><style>
body{margin:0;background:#f7f4ef;color:#514b48;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif}
main{max-width:1100px;margin:auto;padding:18px}.bar{position:sticky;top:0;z-index:10;background:rgba(247,244,239,.96);backdrop-filter:blur(12px);padding:6px 0 14px;border-bottom:1px solid #e7e0d8}.tools{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:8px}input,select{font:inherit;padding:10px 12px;border:1px solid #ddd;border-radius:12px;background:#fff}.summary{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 12px}.pill{background:#fff;border:1px solid #e4ded7;border-radius:999px;padding:5px 10px;font-size:.75rem}.item{background:#fff;border-radius:18px;margin:12px 0;padding:16px;box-shadow:0 6px 20px rgba(0,0,0,.06)}.item.keep{border-left:5px solid #7a9f6e}.item.rewrite{border-left:5px solid #d67d68}.item.dialogue{border-left:5px solid #9e9894}.no{font-size:.92rem;font-weight:900;color:#6c9662}.meta{font-size:.78rem;color:#8c847e;margin:5px 0 12px}.badge{display:inline-block;background:#eef4eb;border-radius:999px;padding:3px 8px;margin-right:4px}.joke{white-space:pre-wrap;line-height:1.78}.label{font-weight:800;margin-top:10px}.answer{margin-top:10px;padding:10px 12px;background:#f2eee8;border-radius:12px}.note{margin:7px 0 0;padding:8px 10px;background:#fbfaf8;border-radius:10px;font-size:.76rem;color:#817972}.small{font-size:.72rem;color:#938b84;margin-top:10px}@media(max-width:800px){main{padding:12px}.tools{grid-template-columns:1fr 1fr}}@media(max-width:520px){.tools{grid-template-columns:1fr}}
</style></head><body><main><div class="bar"><h1>Safe Space｜笑話題庫 v8 審核</h1><p style="line-height:1.6;color:#7c746e">✅＝你已選中的保留題目；✏️＝依照你喜歡的共通點重新撰寫；💬＝對話類型，因你表示大部分不錯，本輪暫不改。Q 編號維持不變，方便你直接回報。</p><div class="summary" id="summary"></div><div class="tools"><input id="search" placeholder="搜尋編號、笑友、內容…"><select id="status"><option value="all">全部狀態</option><option value="keep">✅ 保留</option><option value="rewrite">✏️ 本輪重寫</option><option value="dialogue">💬 對話暫留</option></select><select id="kind"><option value="all">全部類型</option><option value="one_liner">短笑話</option><option value="dialogue">對話</option><option value="riddle">急轉彎</option><option value="story">長篇</option></select><select id="friend"><option value="all">全部笑友</option></select></div></div><div id="list"></div></main><script src="./js/features/jokes-data.js"></script><script>
const db=window.SAFE_SPACE_JOKES_DB;const names=new Map(db.friends.map(f=>[f.id,f.name]));const list=document.getElementById('list');const esc=s=>String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');const kindName={one_liner:'短笑話',dialogue:'對話',riddle:'急轉彎',story:'長篇'};const friendSel=document.getElementById('friend');[...db.friends].sort((a,b)=>a.name.localeCompare(b.name,'zh-Hant')).forEach(f=>{const o=document.createElement('option');o.value=f.id;o.textContent=f.name;friendSel.appendChild(o)});function statusOf(j){if(j.reviewStatus?.startsWith('保留'))return 'keep';if(j.reviewStatus?.startsWith('本輪重寫'))return 'rewrite';if(j.kind==='dialogue')return 'dialogue';return 'other'}function render(){const q=document.getElementById('search').value.trim().toLowerCase(),st=document.getElementById('status').value,k=document.getElementById('kind').value,f=document.getElementById('friend').value;const arr=db.jokes.filter(j=>j.reviewNo&&j.reviewNo.startsWith('Q')).filter(j=>{const s=statusOf(j);if(st!=='all'&&s!==st)return false;if(k!=='all'&&j.kind!==k)return false;if(f!=='all'&&!(j.friendIds||[]).includes(f))return false;const who=(j.friendIds||[]).map(id=>names.get(id)||id).join(' ');const hay=[j.reviewNo,j.id,j.category,j.text,j.question,j.answer,j.reveal,j.explain,who].join(' ').toLowerCase();return !q||hay.includes(q)});list.innerHTML=arr.map(j=>{const s=statusOf(j),who=(j.friendIds||[]).map(id=>names.get(id)||id).join('、');const label=s==='keep'?'✅ 已保留':s==='rewrite'?'✏️ 本輪重寫':s==='dialogue'?'💬 對話暫留':'未標記';return `<article class="item ${s}"><div class="no">${esc(j.reviewNo)} · ${label}</div><div class="meta"><span class="badge">${esc(kindName[j.kind]||j.kind)}</span>${esc(j.category||'')}${who?' · 笑友：'+esc(who):''}</div>${j.text?`<div class="joke">${esc(j.text)}</div>`:''}${j.question?`<div class="label">題目</div><div class="joke">${esc(j.question)}</div>`:''}${(j.answer||j.reveal||j.explain)?`<details class="answer"><summary>查看答案／收尾／梗點</summary>${j.answer?`<div class="label">答案：${esc(j.answer)}</div>`:''}${j.reveal?`<div class="label">收尾：${esc(j.reveal)}</div>`:''}${j.explain?`<div class="label">梗點：${esc(j.explain)}</div>`:''}</details>`:''}${j.source?.includes('v8')?`<div class="note">v8：依照你選中的題目共通點重新整理。</div>`:''}<div class="small">ID：${esc(j.id)}</div></article>`}).join('');document.getElementById('summary').innerHTML=`<span class="pill">全部 Q 題 ${db.jokes.filter(j=>j.reviewNo?.startsWith('Q')).length}</span><span class="pill">✅ 保留 ${db.jokes.filter(j=>statusOf(j)==='keep').length}</span><span class="pill">✏️ 重寫 ${db.jokes.filter(j=>statusOf(j)==='rewrite').length}</span><span class="pill">💬 對話暫留 ${db.jokes.filter(j=>statusOf(j)==='dialogue').length}</span>`}['search','status','kind','friend'].forEach(id=>document.getElementById(id).addEventListener('input',render));render();</script></body></html>
